<p>binding-style-component works!</p>
<div class="progress-bar-container">
    <div class="progress-bar"
         [style.width.%]="progressValue"
         [style.backgroundColor]="isCritical() ? 'red' : 'green'">
    </div>
</div>

<p [style.color]="statusColor">System status: Running</p>

<p>Rainbow process (mỗi 10% đổi màu)</p>
<div class="progress-bar-container rainbow-container">
    <div class="progress-bar rainbow-progress-bar"
         [style.width.%]="progressValue"
         [style.backgroundColor]="getRainbowColor()">
    </div>
</div>
