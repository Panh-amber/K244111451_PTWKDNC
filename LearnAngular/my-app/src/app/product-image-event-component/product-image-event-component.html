<p>product-image-event-component works!</p>
<table border="1">
    <thead>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Unit Price</th>
            <th>Picture</th>
            <th>#</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products; track p.ProductId) {
            <tr>
                <td>{{ p.ProductId }}</td>
                <td>{{ p.ProductName }}</td>
                <td>{{ p.Price }}</td>
                <td>
                    <img [src]="p.Image" [alt]="p.ProductName" width="150" height="150">
                </td>
                <td>
                    <a (click)="viewDetail(p)"
                    style="cursor: pointer;"
                    title="Click here to view detail">Details</a>
                </td>
            </tr>
        }
        @empty {
            <tr>
                <td colspan="5">No products available.</td>
            </tr>
        }
    </tbody>
</table>
